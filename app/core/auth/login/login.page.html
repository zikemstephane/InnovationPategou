<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/onboarding3" color="primary"></ion-back-button>
    </ion-buttons>
    <ion-title class="text-primary font-bold">Connexion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="login-container">
  <div class="login-content">
    <!-- Logo -->
    <div class="logo-section">
      <div class="logo-circle">
        <ion-icon name="car-outline" class="logo-icon"></ion-icon>
      </div>
      <h1 class="app-name">MoovCity</h1>
      <p class="welcome-text">Bienvenue de retour</p>
    </div>
    
    <!-- Formulaire de connexion -->
    <div class="form-section">
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="input-group">
          <ion-item class="custom-input">
            <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
            <ion-input 
              type="email" 
              placeholder="Email" 
              formControlName="email"
              autocomplete="email"
              required>
            </ion-input>
          </ion-item>
          <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            Veuillez entrer une adresse email valide
          </div>
        </div>
        
        <div class="input-group">
          <ion-item class="custom-input">
            <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
            <ion-input 
              type="password" 
              placeholder="Mot de passe" 
              formControlName="password"
              autocomplete="current-password"
              required>
            </ion-input>
            <ion-button 
              slot="end" 
              fill="clear" 
              size="small" 
              (click)="togglePasswordVisibility()"
              color="medium">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-item>
          <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            Le mot de passe est requis
          </div>
        </div>
        
        <div class="forgot-password">
          <ion-button fill="clear" color="medium" size="small" (click)="forgotPassword()">
            Mot de passe oublié ?
          </ion-button>
        </div>
        
        <ion-button 
          type="submit" 
          expand="block" 
          class="login-button"
          [disabled]="loginForm.invalid || isSubmitting">
          <ion-spinner *ngIf="isSubmitting" name="crescent" slot="start"></ion-spinner>
          Se connecter
        </ion-button>
      </form>
    </div>
    
    <!-- Alternative de connexion -->
    <div class="alternative-login">
      <div class="divider">
        <span>OU</span>
      </div>
      
      <div class="social-buttons">
        <ion-button expand="block" fill="outline" class="social-button google">
          <ion-icon name="logo-google" slot="start"></ion-icon>
          Continuer avec Google
        </ion-button>
        
        <ion-button expand="block" fill="outline" class="social-button facebook">
          <ion-icon name="logo-facebook" slot="start"></ion-icon>
          Continuer avec Facebook
        </ion-button>
      </div>
    </div>
    
    <!-- Lien vers l'inscription -->
    <div class="signup-link">
      <p>Vous n'avez pas de compte ?</p>
      <ion-button fill="clear" color="primary" (click)="goToSignup()">
        S'inscrire
      </ion-button>
    </div>
  </div>
</ion-content>
