<ion-tabs>
  <ion-tab-bar slot="bottom" class="custom-tab-bar">

    <ion-tab-button
      *ngFor="let tab of tabs"
      [routerLink]="tab.route"
      routerDirection="root">

      <ion-icon [name]="tab.icon"></ion-icon>
      <ion-label>{{ tab.label }}</ion-label>

    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
