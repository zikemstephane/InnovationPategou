<ion-content class="onboarding-container">
  <!-- Fond avec dégradé subtil -->
  <div class="background-gradient"></div>
  
  <!-- Contenu principal -->
  <div class="content-wrapper">
    <!-- Bouton pour passer l'onboarding -->
    <div class="skip-button">
      <ion-button fill="clear" color="light" (click)="skipOnboarding()">
        <ion-icon slot="icon-only" name="close-outline" style="color: #10b981;"></ion-icon>
      </ion-button>
    </div>
    
    <!-- Illustration animée -->
    <div class="illustration-container">
      <div class="illustration-wrapper">
        <svg width="280" height="220" viewBox="0 0 280 220" fill="none" xmlns="http://www.w3.org/2000/svg" class="main-illustration">
          <!-- Téléphone avec application -->
          <rect x="90" y="40" width="100" height="180" rx="15" fill="#1f2937" opacity="0.9"/>
          <rect x="100" y="50" width="80" height="160" rx="10" fill="#ffffff"/>
          
          <!-- Interface de l'application -->
          <rect x="110" y="60" width="60" height="8" rx="4" fill="#10b981" opacity="0.7"/>
          <rect x="110" y="75" width="40" height="6" rx="3" fill="#e5e7eb"/>
          <rect x="110" y="85" width="50" height="6" rx="3" fill="#e5e7eb"/>
          
          <!-- Carte de prix -->
          <rect x="105" y="100" width="70" height="90" rx="8" fill="#10b981" opacity="0.1"/>
          <text x="140" y="125" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">Tarif</text>
          <text x="140" y="145" text-anchor="middle" fill="#10b981" font-size="20" font-weight="bold">1500</text>
          <text x="140" y="160" text-anchor="middle" fill="#10b981" font-size="12">FCFA</text>
          
          <!-- Personne souriante -->
          <circle cx="60" cy="120" r="20" fill="#10b981" opacity="0.9"/>
          <path d="M60 140 C60 140, 50 160, 50 175 C50 185, 60 190, 70 190 L80 190 C90 190, 100 185, 100 175 C100 160, 90 140, 90 140 L60 140 Z" fill="#10b981" opacity="0.9"/>
          <circle cx="52" cy="115" r="3" fill="#ffffff"/>
          <circle cx="68" cy="115" r="3" fill="#ffffff"/>
          <path d="M52 125 Q60 130 68 125" stroke="#ffffff" stroke-width="2" fill="none"/>
          
          <!-- Symbole de transparence -->
          <circle cx="220" cy="80" r="25" fill="#ffffff" opacity="0.9"/>
          <path d="M205 80 L215 70 L235 70 L235 90 L215 90 Z" fill="#10b981" opacity="0.8"/>
          <circle cx="220" cy="80" r="15" fill="none" stroke="#10b981" stroke-width="2" opacity="0.8"/>
          
          <!-- Points de suspension pour indiquer le chargement -->
          <circle cx="130" cy="180" r="3" fill="#10b981" opacity="0.7">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="140" cy="180" r="3" fill="#10b981" opacity="0.7">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="150" cy="180" r="3" fill="#10b981" opacity="0.7">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="1s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
    </div>
    
    <!-- Texte de l'onboarding -->
    <div class="text-container">
      <h1 class="title">Tarification transparente</h1>
      <p class="subtitle">
        Connaissez le prix de votre course avant de réserver. Plus de surprises, plus de négociations.
      </p>
    </div>
    
    <!-- Navigation -->
    <div class="navigation-container">
      <!-- Indicateur de progression -->
      <div class="progress-indicator">
        <span class="dot"></span>
        <span class="dot active"></span>
        <span class="dot"></span>
      </div>
      
      <!-- Bouton d'action -->
      <ion-button expand="block" (click)="next()" class="next-button">
        Continuer
        <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-content>
