<ion-content [fullscreen]="true" class="splash-content">
  <div class="splash-container">
    <!-- Éléments de fond animés -->
    <div class="background-elements">
      <div class="floating-shape shape-1"></div>
      <div class="floating-shape shape-2"></div>
      <div class="floating-shape shape-3"></div>
      <div class="floating-shape shape-4"></div>
      <div class="pulse-circle pulse-1"></div>
      <div class="pulse-circle pulse-2"></div>
    </div>
    
    <!-- Contenu principal -->
    <div class="content-wrapper">
      <div class="logo-container">
        <div class="logo-bg">
          <div class="logo-inner">
            <ion-icon name="car-outline" class="logo-icon"></ion-icon>
          </div>
        </div>
        <h1 class="app-title">MoovCity</h1>
        <p class="app-subtitle">Votre mobilité, réinventée</p>
      </div>
      
      <!-- Section de chargement -->
      <div class="loading-container">
        <div class="progress-bar-container">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-percentage" id="progressPercentage">0%</div>
        </div>
        <div class="loading-status">
          <ion-spinner name="dots" class="loading-spinner"></ion-spinner>
          <p class="loading-text" id="loadingText">Initialisation...</p>
        </div>
      </div>
    </div>
    
    <!-- Version et crédits -->
    <div class="footer-info">
      <p class="version-text">v1.0.0</p>
      <p class="credits">© 2026 MoovCity | Innov'Up Pategou.</p>
    </div>
  </div>
</ion-content>
