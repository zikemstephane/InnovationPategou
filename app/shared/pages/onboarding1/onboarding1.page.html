<ion-content class="onboarding-container">
  <!-- Fond avec dégradé subtil -->
  <div class="background-gradient"></div>
  
  <!-- Contenu principal -->
  <div class="content-wrapper">
    <!-- Bouton pour passer l'onboarding -->
    <div class="skip-button">
      <ion-button fill="clear" color="light" (click)="skipOnboarding()" >
        <ion-icon slot="icon-only" name="close-outline" style="color: #10b981;"></ion-icon>
      </ion-button>
    </div>
    
    <!-- Illustration animée -->
    <div class="illustration-container">
      <div class="illustration-wrapper">
        <svg width="280" height="220" viewBox="0 0 280 220" fill="none" xmlns="http://www.w3.org/2000/svg" class="main-illustration">
          <!-- Personne attendant -->
          <circle cx="80" cy="100" r="25" fill="#10b981" opacity="0.9"/>
          <path d="M80 130 C80 130, 70 160, 70 180 C70 190, 80 195, 90 195 L110 195 C120 195, 130 190, 130 180 C130 160, 120 130, 120 130 L80 130 Z" fill="#10b981" opacity="0.9"/>
          
          <!-- Voiture -->
          <rect x="150" y="120" width="80" height="40" rx="8" fill="#10b981" opacity="0.8"/>
          <circle cx="165" cy="170" r="8" fill="#1f2937"/>
          <circle cx="215" cy="170" r="8" fill="#1f2937"/>
          <rect x="160" y="125" width="25" height="20" rx="3" fill="#ffffff" opacity="0.8"/>
          <rect x="195" y="125" width="25" height="20" rx="3" fill="#ffffff" opacity="0.8"/>
          
          <!-- Bulle de pensée -->
          <circle cx="60" cy="60" r="15" fill="#ffffff" opacity="0.9"/>
          <circle cx="45" cy="45" r="8" fill="#ffffff" opacity="0.7"/>
          <circle cx="35" cy="35" r="5" fill="#ffffff" opacity="0.5"/>
          <text x="60" y="65" text-anchor="middle" fill="#10b981" font-size="18" font-weight="bold">?</text>
          
          <!-- Horloge -->
          <circle cx="190" cy="60" r="20" fill="none" stroke="#10b981" stroke-width="2" opacity="0.7"/>
          <line x1="190" y1="60" x2="190" y2="50" stroke="#10b981" stroke-width="2" opacity="0.7"/>
          <line x1="190" y1="60" x2="200" y2="65" stroke="#10b981" stroke-width="2" opacity="0.7"/>
          
          <!-- Points de suspension pour indiquer l'attente -->
          <circle cx="180" cy="90" r="3" fill="#10b981" opacity="0.7">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="190" cy="90" r="3" fill="#10b981" opacity="0.7">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
          </circle>
          <circle cx="200" cy="90" r="3" fill="#10b981" opacity="0.7">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="1s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
    </div>
    
    <!-- Texte de l'onboarding -->
    <div class="text-container">
      <h1 class="title">Fini l'attente interminable ?</h1>
      <p class="subtitle">
        Ne perdez plus de temps à chercher un taxi. Les tarifs opaques et les longues minutes d'attente sont révolues.
      </p>
    </div>
    
    <!-- Navigation -->
    <div class="navigation-container">
      <!-- Indicateur de progression -->
      <div class="progress-indicator">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      
      <!-- Bouton d'action -->
      <ion-button expand="block" (click)="next()" class="next-button">
        Continuer
        <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-content>
